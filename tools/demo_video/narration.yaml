# AsOf Demo Video Narration Templates
# Pacing: ~130 words per minute
# Total target duration: 2:30 to 3:00 minutes (150 to 180 seconds)
# Placeholders are dynamically injected at runtime from the live API / benchmark results.

scenes:
  scene_1:
    name: "Hook"
    target_duration: 18.0
    text: >
      Welcome to AsOf, a bi-temporal claims decision agent built for Graph Hacks,
      competing in the Agents That Act on Connected Data track. In insurance, facts
      change after decisions are made. Traditional systems store only current state,
      making it impossible to answer: was the decision right, given what we knew then?

  scene_2:
    name: "Impact Scan"
    target_duration: 32.0
    text: >
      We ingest a retroactive flash flood endorsement effective June first, but recorded
      on June tenth. AsOf launches a live bi-temporal graph scan. Across {claims_scanned}
      claims evaluated, {decisions_changed} past denial is affected. The agent automatically
      attaches reconsideration flags with grounded audit notes, protecting policyholders from
      unnoticed wrong decisions.

  scene_3:
    name: "Hero Claim"
    target_duration: 38.0
    text: >
      Let us inspect claim CLM-HERO-001. On June eighth, the claim was denied. Notice on the
      graph that the endorsement node is faded and marked 'not yet known'. Now, watch what happens
      as we drag the system-time slider to June eleventh. As the system learns of the retroactive
      endorsement, the verdict flips to approved, and the evidence path lights up. Both records
      remain permanently preserved.

  scene_4:
    name: "Agent and MCP"
    target_duration: 25.0
    text: >
      AsOf exposes its reasoning through the Model Context Protocol. The autonomous agent selects
      tools dynamically based on claim type. Here, our clean MCP client connects to the FastMCP server,
      lists the seven bi-temporal tools, and evaluates the claim directly on FalkorDB under strict
      server-managed temporal coordinates.

  scene_5:
    name: "Why a Graph"
    target_duration: 22.0
    text: >
      Why is a graph essential? Coverage resolution is a multi-hop traversal from claim to policy,
      endorsement, and coverage clause. Furthermore, FalkorDB detects connected provider-shop rings
      using graph algorithms. Clicking View Cypher reveals the exact parameterized queries executed
      in the database engine.

  scene_6:
    name: "Trust and Firewall"
    target_duration: 22.0
    text: >
      Trust requires mathematical verification. Every verdict generates a cryptographic SHA-256
      receipt node. If anyone maliciously alters a database record, the cryptographic audit immediately
      trips. Next, when an adversarial prompt attempts to breach the time ceiling, our Temporal Firewall
      prevents future-information leakage.

  scene_7:
    name: "Results and Close"
    target_duration: 20.0
    text: >
      Our benchmark compares Latest-State agents against AsOf. While latest-state models suffer
      from {latest_state_leaks} future-data leaks, AsOf achieves zero leaks and {asof_accuracy} percent
      accuracy. Reconstruct the past. Know what the system knew.
